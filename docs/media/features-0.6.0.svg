<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">lolPing 0.6.0 feature preview</title>
  <desc id="desc">A dark desktop preview showing the action wheel, room chat, cursor skins and Heartsteel mode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10151d"/><stop offset="1" stop-color="#1b2430"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .panel{fill:#202a37;stroke:#344456;stroke-width:2}.muted{fill:#8ea0b4;font:18px Segoe UI,Arial,sans-serif}.text{fill:#edf4fb;font:22px Segoe UI,Arial,sans-serif}.small{fill:#c3d0dd;font:16px Segoe UI,Arial,sans-serif}.title{fill:#fff;font:700 30px Segoe UI,Arial,sans-serif}.accent{fill:#55c2ff}.gold{fill:#f3b64c}.green{fill:#62d69a}
    </style>
  </defs>
  <rect width="1400" height="860" fill="url(#bg)"/>
  <text x="56" y="70" class="title">lolPing 0.6.0</text>
  <text x="56" y="102" class="muted">Windows desktop wheels, room chat, cursor skins and Heartsteel mode</text>

  <g filter="url(#shadow)">
    <rect x="56" y="150" width="620" height="620" rx="18" class="panel"/>
    <text x="88" y="202" class="title">Action wheel</text>
    <text x="88" y="234" class="muted">Hold Win + drag, then release on an action</text>
    <circle cx="365" cy="480" r="182" fill="#131b25" stroke="#4b6a82" stroke-width="3"/>
    <circle cx="365" cy="480" r="64" fill="#2c3e50" stroke="#73d1ff" stroke-width="3"/>
    <text x="334" y="475" class="small">ACTION</text><text x="342" y="498" class="small">WHEEL</text>
    <g fill="#24384a" stroke="#63c9ff" stroke-width="2">
      <path d="M365 304L425 320 446 372 410 409 365 389Z"/><path d="M490 354L534 400 520 456 468 460 447 416Z"/>
      <path d="M544 480L528 540 476 555 442 514 463 470Z"/><path d="M490 606L444 650 389 634 386 582 430 557Z"/>
      <path d="M365 656L305 640 285 588 321 551 365 571Z"/><path d="M240 606L196 560 210 504 262 500 283 544Z"/>
      <path d="M186 480L202 420 254 405 288 446 267 490Z"/><path d="M240 354L286 310 341 326 344 378 300 403Z"/>
    </g>
    <g class="small" text-anchor="middle"><text x="389" y="350">Screenshot</text><text x="490" y="405">Mute</text><text x="493" y="525">Browser</text><text x="423" y="625">Folder</text><text x="301" y="625">Lock</text><text x="238" y="525">Website</text><text x="240" y="405">App</text><text x="337" y="350">Desktop</text></g>
    <text x="88" y="722" class="small">Built-in actions can be replaced and configured per slot.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="150" width="624" height="286" rx="18" class="panel"/>
    <text x="752" y="202" class="title">Room chat and danmaku</text>
    <text x="752" y="234" class="muted">Plain-text chat stays end-to-end encrypted in the room</text>
    <rect x="752" y="262" width="560" height="126" rx="12" fill="#151d27"/>
    <text x="780" y="300" class="small"><tspan fill="#62d69a">Alice</tspan>  Screenshot ready</text>
    <text x="780" y="337" class="small"><tspan fill="#f3b64c">Bob</tspan>  Nice timing!</text>
    <text x="780" y="374" class="small"><tspan fill="#55c2ff">You</tspan>  Heartsteel ready</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="470" width="300" height="300" rx="18" class="panel"/>
    <text x="752" y="522" class="title">Cursor skins</text>
    <text x="752" y="552" class="muted">Modern and classic</text>
    <rect x="752" y="586" width="236" height="62" rx="10" fill="#151d27"/>
    <path d="M800 602l38 35-18 3 12 26-10 5-13-26-11 14z" fill="#fff"/>
    <rect x="752" y="664" width="236" height="62" rx="10" fill="#151d27"/>
    <path d="M800 680l38 35-18 3 12 26-10 5-13-26-11 14z" fill="#f3b64c"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1048" y="470" width="296" height="300" rx="18" class="panel"/>
    <text x="1080" y="522" class="title">Heartsteel</text>
    <text x="1080" y="552" class="muted">Solo or room mode</text>
    <circle cx="1196" cy="650" r="72" fill="#392a1e" stroke="#f3b64c" stroke-width="4"/>
    <path d="M1196 604l16 31 34 5-25 24 6 34-31-16-31 16 6-34-25-24 34-5z" fill="#f3b64c"/>
    <text x="1132" y="744" class="small">+125 max health</text>
  </g>
</svg>
