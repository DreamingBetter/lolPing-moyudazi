name: Release

# Push a tag that matches package.json's version (for example v0.2.0) to build the Windows installer and publish it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v0.6.1

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
      # A draft: installed apps look for latest.yml in the newest published release, so it must not show up before the Windows job has
      # uploaded it (every check would fail with "Cannot find latest.yml" meanwhile). The publish job at the end makes it public.
      # A draft is not found by `gh release view`, so look for the tag in the list. A re-run keeps the release it already has.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -Fx "$RELEASE_TAG" > /dev/null \
            || gh release create "$RELEASE_TAG" --title "lolPing-摸鱼搭子 $RELEASE_TAG" --generate-notes --draft

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:helper
      - run: npm test
      - run: npm run dist
      - name: Verify Heartsteel sound in Windows build
        shell: bash
        run: test -f out/renderer/sounds/heartsteel.mp3
      - name: Upload the installer and its update files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # latest.yml and the blockmap are what electron-updater in an installed lolPing-摸鱼搭子 reads to find and fetch this version.
        run: |
          gh release upload "$RELEASE_TAG" \
            "release/lolPing-moyudazi-Setup-${RELEASE_TAG#v}.exe" \
            "release/latest.yml" \
            "release/lolPing-moyudazi-Setup-${RELEASE_TAG#v}.exe.blockmap" \
            --clobber

  # The installer and update files are uploaded: only now does the draft become the latest release.
  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false
